<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Reelay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #090d16; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
        .card { background: #1e293b; padding: 32px 24px; border-radius: 24px; max-width: 400px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .icon { width: 64px; height: 64px; background: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
        h1 { font-size: 24px; margin-bottom: 6px; }
        p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        a.btn { display: block; background: #2563eb; color: white; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 16px; margin-bottom: 12px; transition: 0.2s; }
        a.btn:active { transform: scale(0.98); background: #1d4ed8; }
        a.secondary { display: block; background: #334155; color: #cbd5e1; text-decoration: none; padding: 12px; border-radius: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🛡️</div>
        <h1>Reelay</h1>
        <p class="sub">by BlackBox THC • Stealth Launcher</p>
        <a class="btn" href="intent://open#Intent;scheme=reelay;package=com.reelay.app;end">🚀 Launch Reelay App</a>
        <a class="secondary" href="reelay://open">Alternative Link (reelay://)</a>
    </div>
</body>
</html>
